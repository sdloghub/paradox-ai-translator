name: Publish verified release

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build release distributions run ID
        required: true
        type: string
      version:
        description: Release version (without v prefix)
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: ${{ inputs.build_run_id }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Check version and successful build provenance
        id: build
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          if not re.fullmatch(r'[0-9][0-9A-Za-z.+-]{0,79}', os.environ['VERSION']):
              raise SystemExit('Invalid version')
          if not os.environ['BUILD_RUN'].isdigit():
              raise SystemExit('Invalid build run ID')
          run = json.loads(subprocess.check_output(['gh', 'api', f"repos/{os.environ['GH_REPO']}/actions/runs/{os.environ['BUILD_RUN']}"]))
          if (run['conclusion'] != 'success' or run['path'] != '.github/workflows/build-release.yml'
              or run['head_branch'] != 'main' or run['head_repository']['full_name'] != os.environ['GH_REPO']):
              raise SystemExit('Require successful same-repository main release build')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('sha=' + run['head_sha'] + '\n')
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.build.outputs.sha }}
          path: source
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id }}
          pattern: release-*
          path: artifacts
      - name: Validate and prepare versioned assets
        env:
          BUILD_SHA: ${{ steps.build.outputs.sha }}
        run: python source/packaging/build_github_release.py --version "$VERSION" --commit "$BUILD_SHA" --artifacts artifacts --output release
      - name: Publish release
        env:
          BUILD_SHA: ${{ steps.build.outputs.sha }}
        shell: bash
        run: |
          cp packaging/RELEASE_NOTES.md release-notes.md
          printf '\n源码提交：%s\n构建记录：https://github.com/%s/actions/runs/%s\n' "$BUILD_SHA" "$GH_REPO" "$BUILD_RUN" >> release-notes.md
          gh release create "v$VERSION" release/* --target "$BUILD_SHA" --title "Workshop Translator v$VERSION" --notes-file release-notes.md --prerelease
