# Enable only after the matching Let's Encrypt certificate has been issued.
server {
    listen 443 ssl;
    server_name paradox-ai-translator.com;
    ssl_certificate /etc/letsencrypt/live/paradox-ai-translator.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paradox-ai-translator.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 32m;
    add_header X-Content-Type-Options nosniff always;
    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host 127.0.0.1:8765;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
