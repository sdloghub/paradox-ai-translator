# Install before issuing the certificate. Do not serve the application over HTTP.
server {
    listen 80;
    server_name paradox-ai-translator.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/workshop-acme;
        default_type text/plain;
    }
    location / {
        return 308 https://paradox-ai-translator.com$request_uri;
    }
}
